package:
  name: node-child-process
  dependencies:
    - aff
    - arrays
    - datetime
    - effect
    - either
    - exceptions
    - foreign
    - foreign-object
    - functions
    - maybe
    - node-buffer
    - node-event-emitter
    - node-fs
    - node-os
    - node-streams
    - nullable
    - parallel
    - partial
    - posix-types
    - prelude
    - refs
    - safe-coerce
    - strings
    - unsafe-coerce

  test:
    main: Test.Main
    dependencies:
      - aff
      - console
      - effect
      - either
      - exceptions
      - maybe
      - node-buffer
      - node-event-emitter
      - node-streams
      - posix-types
      - prelude
      - unsafe-coerce

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output, --threaded]
  packageSet:
    registry: 77.7.0
  extraPackages:
    aff:
      path: "../purust-aff"
    arrays:
      path: "../purust-arrays"
    arraybuffer-types:
      path: "../purust-arraybuffer-types"
